[project]
name = "atlas"
version = "0.1.0"
description = "AI-native control plane for dedicated Debian application fleets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jsonschema[format]>=4.23,<5",
    "pyyaml>=6,<7",
]

[project.scripts]
atlas = "atlas.cli:run"
atlas-engine = "atlas_engine.cli:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk/src/atlas", "engine/src/atlas_engine"]

[dependency-groups]
dev = [
    "ansible-core>=2.21,<2.22",
    "ansible-lint>=26,<27",
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["sdk/tests", "engine/tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D103", "INP001", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["sdk/src", "sdk/tests", "engine/src", "engine/tests"]
