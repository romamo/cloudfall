[project]
name = "cloudfall"
version = "0.1.0"
description = "AI-native control plane for dedicated Debian application fleets"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "jsonschema[format]>=4.23,<5",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2,<3",
]

[project.scripts]
cloudfall = "cloudfall.cli:run"
cloudfall-engine = "cloudfall_engine.cli:run"
cloudfall-mcp = "cloudfall.mcp_server:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk/src/cloudfall", "engine/src/cloudfall_engine"]

[dependency-groups]
dev = [
    "ansible-core>=2.21,<2.22",
    "ansible-lint>=26,<27",
    "mcp>=2,<3",
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["sdk/tests", "engine/tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D103", "INP001", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["sdk/src", "sdk/tests", "engine/src", "engine/tests"]
