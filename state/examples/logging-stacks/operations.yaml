---
apiVersion: cloudfall/v1
kind: LoggingStack
metadata:
  id: operations
  description: Example parallel operational logging stack
spec:
  environment: production
  migration:
    mode: parallel
    preserveLegacyAgents: true
  software:
    lokiPackageVersion: "3.7.2"
    grafanaPackageVersion: "13.1.0"
    alloyPackageVersion: "1.17.1-1"
  metrics:
    backend:
      listenAddress: 127.0.0.1
      port: 9090
      storagePath: /var/lib/prometheus-cloudfall
      retentionHours: 360
    collection:
      intervalSeconds: 60
  backend:
    server: h1
    listenAddress: 127.0.0.1
    port: 3100
    storage:
      type: filesystem
      path: /var/lib/loki-cloudfall
    retentionHours: 720
  gateway:
    serverName: logs.example.internal
    listenAddress: 0.0.0.0
    port: 3101
    tls:
      certificatePath: /etc/cloudfall/logging/server.crt
      keyPath: /etc/cloudfall/logging/server.key
      clientCaPath: /etc/cloudfall/logging/client-ca.crt
  grafana:
    listenAddress: 127.0.0.1
    port: 3000
    adminPasswordPath: /etc/cloudfall/logging/grafana-admin-password
  alerting:
    alertmanager:
      listenAddress: 127.0.0.1
      port: 9093
    receivers:
      - id: operations-webhook
        webhook:
          url: https://hooks.example.internal/cloudfall
      - id: operations-email
        email:
          smarthost: smtp.example.internal:587
          from: alerts@example.internal
          to: oncall@example.internal
          authUsername: alerts@example.internal
          authPasswordFile: /etc/cloudfall/logging/smtp-password
  collectors:
    servers:
      - h1
      - h2
    clientTls:
      caPath: /etc/cloudfall/logging/ca.crt
      certificatePath: /etc/cloudfall/logging/client.crt
      keyPath: /etc/cloudfall/logging/client.key
    journal:
      enabled: true
      maxAgeHours: 24
    files:
      - id: crm-backend
        path: /var/log/crm/backend/*.log
        servers:
          - h1
          - h2
        project: crm
        component: crm-backend
