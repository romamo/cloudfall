---
apiVersion: cloudfall/v1
kind: Domain
metadata:
  id: crm-site
  description: Example public route for the CRM backend
spec:
  primaryName: crm.example.test
  aliases:
    - www.crm.example.test
  proxy:
    server: h2
    configurationPath: /etc/nginx/sites-available/crm.example.test.conf
    service: nginx.service
    upstream:
      address: 127.0.0.1
      port: 8100
  origin:
    server: h1
    configurationPath: /etc/nginx/sites-available/crm-origin.conf
    service: nginx.service
    scheme: http
    port: 8100
    serverName: crm.example.test
  edge:
    provider: cloudflare
    mode: dns-only
  tls:
    mode: required
  healthCheck:
    scheme: https
    path: /health
    expectedStatuses:
      - 200
    timeoutSeconds: 5
