---
argument_specs:
  main:
    short_description: Prepare a Debian host for Cloudfall application deployments
    options:
      cloudfall_bootstrap_apps_root:
        type: path
        default: /srv/apps
      cloudfall_bootstrap_packages:
        type: list
        elements: str
        default:
          - acl
          - ca-certificates
          - curl
          - git
          - rsync
          - unzip
      cloudfall_bootstrap_applications:
        type: list
        elements: dict
        required: true
        options:
          id:
            type: str
            required: true
          user:
            type: str
            required: true
          approval:
            type: str
            choices:
              - automatic
              - manual
            required: true
      cloudfall_bootstrap_components:
        type: list
        elements: dict
        required: true
        options:
          id:
            type: str
            required: true
          application:
            type: str
            required: true
          application_user:
            type: str
            required: true
          install_root:
            type: path
            required: true
