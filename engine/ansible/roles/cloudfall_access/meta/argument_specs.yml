---
argument_specs:
  main:
    short_description: Enforce declared key-only SSH access for root
    options:
      cloudfall_access_ssh_public_keys:
        type: list
        elements: dict
        required: true
        options:
          id:
            type: str
            required: true
          owner:
            type: str
            required: true
          environment:
            type: str
            required: true
          algorithm:
            type: str
            required: true
          publicKey:
            type: str
            required: true
          lifecycle:
            type: str
            choices:
              - active
              - revoked
            required: true
      cloudfall_access_sshd_drop_in:
        type: path
        default: /etc/ssh/sshd_config.d/00-cloudfall-key-only.conf
